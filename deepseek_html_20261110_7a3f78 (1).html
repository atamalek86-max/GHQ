<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>آزمون سلامت روان GHQ-28 | آکادمی آکسون</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --g-900:#08382a; --g-800:#0c4d38; --g-700:#0f6b4a; --g-600:#12946a;
  --g-500:#17b57f; --g-400:#3fd39b; --g-300:#7de6bd; --g-200:#bdf0da;
  --g-100:#e3f8ee; --g-50:#f3fbf7;
  --ink:#12302a; --muted:#5c7a70; --line:#d8ece3;
  --red:#dc2626;
  --radius:18px;
  --shadow:0 10px 30px rgba(9,80,58,.10);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:'Vazirmatn',Tahoma,system-ui,sans-serif;
  color:var(--ink); line-height:1.95; min-height:100vh;
  background:
    radial-gradient(1100px 560px at 100% -10%, #d9f5e7 0%, transparent 60%),
    radial-gradient(900px 500px at -10% 10%, #eafcf3 0%, transparent 55%),
    #f5fbf8;
  -webkit-font-smoothing:antialiased;
  -webkit-text-size-adjust:100%;
}
button{font-family:inherit;cursor:pointer}
.wrap{max-width:860px;margin:0 auto;padding:24px 16px 60px; position: relative; z-index: 1;}

/* ---------- Watermark ---------- */
.watermark {
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: 80%;
  max-width: 500px;
  opacity: 0.05;
  pointer-events: none;
  z-index: 0;
}

/* ---------- Header & Logo ---------- */
.topbar {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 16px;
  margin-bottom: 26px;
}
.top-logo-img {
  height: 96px; 
  max-width: 90%;
  width: auto;
  border-radius: 16px;
  object-fit: contain;
  box-shadow: 0 8px 24px rgba(9,80,58,.15);
}
.pill {
  background: #fff;
  border: 1px solid var(--line);
  border-radius: 999px;
  padding: 8px 18px;
  font-size: 13px;
  font-weight: 700;
  color: var(--g-700);
  box-shadow: 0 4px 12px rgba(9,80,58,.06);
}

/* ---------- لوگوی گزارش (فقط برای چاپ) ---------- */
.report-logo {
  display: none; 
  text-align: center;
  margin-bottom: 22px;
}
.report-logo-img {
  height: 90px;
  max-width: 80%;
  border-radius: 16px;
  box-shadow: 0 6px 18px rgba(9,80,58,.15);
  object-fit: contain;
}

.card{background:#fff;border:1px solid var(--line);border-radius:var(--radius);
  padding:26px;box-shadow:var(--shadow);animation:slideIn .4s ease}
@keyframes slideIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.card-title{margin:0 0 6px;font-size:19px;font-weight:800;color:var(--g-800)}
.card-sub{margin:0 0 22px;font-size:13px;color:var(--muted)}

.field{margin-bottom:16px}
.field label{display:block;font-size:13px;font-weight:700;margin-bottom:6px;color:var(--g-800)}
.field label .req{color:var(--red)}
.input{width:100%;padding:13px 16px;border:1.5px solid var(--line);border-radius:12px;
  font-family:inherit;font-size:14px;background:var(--g-50);color:var(--ink);
  transition:.2s;outline:none}
.input:focus{border-color:var(--g-400);background:#fff;box-shadow:0 0 0 4px rgba(63,211,155,.18)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:640px){.grid2{grid-template-columns:1fr}}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:13px 26px;border-radius:13px;border:1.5px solid transparent;
  font-size:14px;font-weight:700;transition:.2s;text-decoration:none}
.btn-primary{background:linear-gradient(135deg,var(--g-700),var(--g-500));color:#fff;
  box-shadow:0 8px 20px rgba(18,148,106,.3)}
.btn-primary:hover{transform:translateY(-1px);box-shadow:0 12px 26px rgba(18,148,106,.4)}
.btn-ghost{background:#fff;border-color:var(--line);color:var(--g-800)}
.btn-ghost:hover{background:var(--g-50);border-color:var(--g-200)}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none;box-shadow:none}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}
.actions .btn{flex:1 1 auto;min-width:140px}

.quiz-top{margin-bottom:18px}
.progress-track{height:8px;background:var(--g-100);border-radius:999px;overflow:hidden;margin-bottom:12px}
.progress-fill{height:100%;width:0;background:linear-gradient(90deg,var(--g-700),var(--g-400));
  border-radius:999px;transition:width .4s ease}
.meta{display:flex;justify-content:flex-start;align-items:center;gap:10px;flex-wrap:wrap}
.chip{display:inline-block;padding:5px 12px;border-radius:999px;font-size:12px;font-weight:700}
.chip-count{background:var(--g-100);color:var(--g-800)}

.q-card{background:#fff;border:1px solid var(--line);border-radius:var(--radius);
  padding:26px;box-shadow:var(--shadow);animation:slideIn .35s ease}
.q-text{margin:0 0 22px;font-size:16px;font-weight:600;line-height:1.9;color:var(--ink)}

.options{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;align-items:center;gap:14px;padding:15px 18px;
  background:#fff;border:1.5px solid var(--line);border-radius:14px;
  font-family:inherit;font-size:14px;font-weight:500;color:var(--ink);
  text-align:right;transition:all .2s ease}
.opt:hover{border-color:var(--g-300);background:var(--g-50);transform:translateX(-2px)}
.opt-num{width:28px;height:28px;border-radius:8px;background:var(--g-100);color:var(--g-700);
  display:grid;place-items:center;font-weight:800;font-size:13px;flex-shrink:0;transition:.2s}
.opt-label{flex:1}
.opt-check{opacity:0;font-size:18px;font-weight:800;color:#fff;transition:.2s}
.opt.selected{background:linear-gradient(135deg,var(--g-700),var(--g-500));color:#fff;
  border-color:var(--g-600);box-shadow:0 8px 20px rgba(18,148,106,.3)}
.opt.selected .opt-num{background:rgba(255,255,255,.25);color:#fff}
.opt.selected .opt-check{opacity:1}

.nav-btns{display:flex;gap:12px;margin-top:22px}
.nav-btns .btn{flex:1}

.hero{border-radius:var(--radius);padding:28px;color:#fff;margin-bottom:16px;
  box-shadow:var(--shadow);position:relative;overflow:hidden}
.hero::after{content:'';position:absolute;width:260px;height:260px;border-radius:50%;
  background:rgba(255,255,255,.09);top:-120px;left:-80px;pointer-events:none}
.hero-header{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;
  margin-bottom:16px;position:relative;z-index:2}
.hero-tag{font-size:12px;opacity:.85;margin:0 0 4px}
.hero-name{font-size:22px;font-weight:800;margin:0}
.hero-body{display:flex;align-items:center;gap:22px;flex-wrap:wrap;position:relative;z-index:2}
.score-ring{width:112px;height:112px;border-radius:50%;display:grid;place-items:center;
  background:rgba(255,255,255,.14);border:5px solid rgba(255,255,255,.35);flex-shrink:0}
.score-ring b{font-size:28px;font-weight:800;line-height:1}
.score-ring span{font-size:11px;opacity:.85}
.hero-status{font-size:17px;font-weight:800;margin:0 0 4px}
.hero-status-sub{font-size:13px;opacity:.92;margin:0}

.note{background:var(--g-50);border:1px dashed var(--g-200);border-radius:14px;
  padding:18px 20px;font-size:13px;line-height:2;color:var(--g-900);margin-bottom:16px}
.alert{border-radius:16px;padding:18px 20px;margin-bottom:16px;font-size:13.5px;line-height:2;
  border:2px solid var(--red);background:#fff5f5;color:#7f1d1d}
.alert h3{margin:0 0 6px;font-size:15px;font-weight:800;color:var(--red)}

.info-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.info-item{background:var(--g-50);border:1px solid var(--line);border-radius:12px;padding:11px 15px}
.info-item .k{display:block;font-size:11px;color:var(--muted);margin-bottom:2px}
.info-item .v{font-size:13.5px;font-weight:700}

.section-title{font-size:17px;font-weight:800;color:var(--g-800);margin:26px 4px 14px}

/* =========================================
   Visual Dashboard (Inspired by uploaded image)
   ========================================= */
.visual-dashboard {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 16px;
  margin-bottom: 26px;
  direction: rtl;
}
@media (max-width: 700px) {
  .visual-dashboard { grid-template-columns: repeat(2, 1fr); gap: 20px; }
}

.vd-card {
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
}
.vd-tube {
  width: 100%;
  max-width: 100px;
  height: 130px;
  background: #fff;
  border-radius: 24px;
  box-shadow: 0 10px 24px rgba(0,0,0,.06), inset 0 0 0 1px rgba(0,0,0,.03);
  position: relative;
  overflow: hidden;
  margin-bottom: 12px;
}
.vd-fill {
  position: absolute;
  bottom: 0;
  left: 0;
  width: 100%;
  height: 0; /* Animated via JS */
  background: var(--wave-color);
  transition: height 1.2s cubic-bezier(0.2, 0.8, 0.2, 1);
  border-radius: 0 0 24px 24px;
}
/* Wave effect on top of the fill */
.vd-fill::before, .vd-fill::after {
  content: '';
  position: absolute;
  width: 200%;
  height: 200%;
  top: 0;
  left: 50%;
  background: var(--wave-color);
  border-radius: 40%;
  transform: translate(-50%, -75%);
  opacity: 0.8;
}
.vd-fill::before {
  animation: wave-spin 7s linear infinite;
}
.vd-fill::after {
  animation: wave-spin 9s linear infinite;
  border-radius: 45%;
  opacity: 0.6;
}
@keyframes wave-spin {
  0% { transform: translate(-50%, -75%) rotate(0deg); }
  100% { transform: translate(-50%, -75%) rotate(360deg); }
}

.vd-icon {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  z-index: 2;
  color: #7f8c8d;
  opacity: 0.7;
}
.vd-icon svg {
  width: 42px;
  height: 42px;
  stroke: currentColor;
  stroke-width: 1.8;
  fill: none;
  stroke-linecap: round;
  stroke-linejoin: round;
}

.vd-pct {
  font-size: 16px;
  font-weight: 800;
  margin-bottom: 2px;
}
.vd-label {
  font-size: 12px;
  font-weight: 700;
}

/* =========================================
   Detailed Domain Cards
   ========================================= */
.dcard{border:1.5px solid var(--line);border-radius:16px;padding:20px;margin-bottom:14px;
  background:#fff;break-inside:avoid; position: relative; z-index: 1;}
.dcard-top{display:flex;justify-content:space-between;align-items:center;gap:10px;
  flex-wrap:wrap;margin-bottom:10px}
.dcard-title{font-size:15.5px;font-weight:800;margin:0;color:var(--g-800)}
.badge{display:inline-block;padding:5px 13px;border-radius:999px;font-size:12px;
  font-weight:800;color:#fff}
.dcard-score{font-size:12px;color:var(--muted);font-weight:700;margin-bottom:6px}
.track{height:9px;border-radius:999px;background:#eaf4ef;overflow:hidden;margin-bottom:16px}
.track i{display:block;height:100%;border-radius:999px;transition:width .8s ease}

.def-block{
  background:linear-gradient(135deg,#f6fdf9,#eefaf3);
  border:1px solid var(--g-200);
  border-right:4px solid var(--g-500);
  border-radius:12px;padding:14px 16px;margin-bottom:16px
}
.def-block h4{margin:0 0 6px;font-size:12.5px;font-weight:800;color:var(--g-700)}
.def-block p{margin:0;font-size:13px;line-height:2;color:#2b463d}

.block{margin-bottom:14px}
.block:last-child{margin-bottom:0}
.block h4{margin:0 0 4px;font-size:12.5px;font-weight:800;color:var(--g-700)}
.block p{margin:0;font-size:13px;line-height:2;color:#2b463d}
.block.action{background:var(--g-50);border:1px solid var(--g-200);border-radius:12px;padding:14px 16px}
.block.action h4{color:var(--g-800)}

.total-card{border-radius:16px;padding:22px;color:#fff;margin-bottom:16px;break-inside:avoid}
.total-card h3{margin:0 0 8px;font-size:16px;font-weight:800}
.total-card p{margin:0;font-size:13.5px;line-height:2}

details.review{margin-top:20px;background:#fff;border:1px solid var(--line);
  border-radius:16px;padding:4px 20px}
details.review summary{cursor:pointer;padding:14px 0;font-weight:800;color:var(--g-800);
  font-size:14px;list-style:none}
details.review summary::-webkit-details-marker{display:none}
details.review summary::before{content:'▸';margin-left:8px;color:var(--g-600);transition:.2s}
details.review[open] summary::before{transform:rotate(90deg);display:inline-block}
.rev-row{display:flex;justify-content:space-between;gap:12px;padding:10px 0;
  border-top:1px dashed var(--line);font-size:12.5px}
.rev-q{flex:1;color:#2b463d}
.rev-a{font-weight:700;color:var(--g-700);white-space:nowrap}

.academy-credit{
  display:flex;align-items:center;justify-content:center;gap:9px;
  margin-top:26px;padding:12px 18px;
  background:var(--g-50);border:1px dashed var(--g-200);border-radius:12px;
  font-size:12px;font-weight:700;color:var(--g-800)
}

.disclaimer{font-size:12px;color:var(--muted);line-height:2;text-align:center;margin-top:22px}

.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);
  background:var(--g-800);color:#fff;padding:12px 24px;border-radius:12px;
  font-size:13px;font-weight:600;box-shadow:0 10px 30px rgba(0,0,0,.2);
  z-index:1000;opacity:0;pointer-events:none;transition:opacity .3s}
.toast.show{opacity:1}

@media print{
  @page{size:A4;margin:13mm}
  body{
    background:#fff !important;font-size:11.5px;
    -webkit-print-color-adjust:exact;print-color-adjust:exact;
  }
  .wrap{max-width:100%;padding:0}
  .no-print,.topbar,.nav-btns,.actions{display:none !important}
  .card,.dcard,.hero,.total-card,.alert,.note,details.review{
    box-shadow:none !important;break-inside:avoid;page-break-inside:avoid}
  .hero,.total-card,.badge,.score-ring,.track i,.progress-fill,.def-block,.vd-tube,.vd-fill,.vd-icon{
    -webkit-print-color-adjust:exact;print-color-adjust:exact}
  .dcard{border-color:#ccc}
  details.review summary{display:none}
  .hero{color:#fff !important}
  .hero::after{display:none}
  
  .report-logo {
    display: block !important; 
    margin-top: 10px;
  }
  .report-logo-img { 
    height: 70px; 
    margin-bottom: 10px; 
  }
  
  .watermark {
    position: fixed;
    opacity: 0.07;
    -webkit-print-color-adjust:exact;print-color-adjust:exact;
  }

  /* در چاپ، افکت موج را حذف و لوله‌ها را کاملاً پر نشان می‌دهیم */
  .vd-fill {
    transition: none !important;
  }
  .vd-fill::before, .vd-fill::after {
    display: none !important;
  }
}
</style>
</head>

<script>

const $ = s => document.querySelector(s);
const fa = s => String(s).replace(/\d/g, d => '۰۱۲۳۴۵۶۷۸۹'[d]);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function clearAdvanceTimer(){ if(advanceTimer){ clearTimeout(advanceTimer); advanceTimer=null; } }

function showToast(msg){
  const t = $('#toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2400);
}

function animateNumber(el, to, dur){
  const start = performance.now();
  function tick(now){
    const p = Math.min((now - start) / dur, 1);
    el.textContent = fa(Math.round(to * p));
    if(p < 1) requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
}

function startQuiz(){
  const required = ['childName','parentName','relation','phone','birthDate'];
  for(const k of required){
    if(!info[k].trim()){
      showToast('لطفاً همه فیلدهای ستاره‌دار را تکمیل کنید.');
      return;
    }
  }
  currentQ = 0;
  stage = 'quiz';
  renderQuiz();
}

/* =========================================================
   Render: Quiz
   ========================================================= */
function renderQuiz(){
  clearAdvanceTimer();
  const q = QUESTIONS[currentQ];
  const ans = answers[currentQ];
  const progress = (currentQ / 28) * 100;

  $('#app').innerHTML = `
    <div class="quiz-top">
      <div class="progress-track"><div class="progress-fill" style="width:${progress}%"></div></div>
      <div class="meta">
        <span class="chip chip-count">سوال ${fa(currentQ+1)} از ${fa(28)}</span>
      </div>
    </div>

    <div class="q-card" id="qCard">
      <p class="q-text">${q.t}</p>
      <div class="options" id="options">
        ${OPTIONS.map((o, i) => `
          <button type="button" class="opt ${ans === i ? 'selected' : ''}" data-v="${i}">
            <span class="opt-num">${fa(i+1)}</span>
            <span class="opt-label">${o}</span>
            <span class="opt-check">✓</span>
          </button>
        `).join('')}
      </div>
    </div>

    <div class="nav-btns">
      <button class="btn btn-ghost" id="prevBtn" ${currentQ === 0 ? 'disabled' : ''}>← سوال قبل</button>
      <button class="btn btn-primary" id="nextBtn">
        ${currentQ === 27 ? 'مشاهده گزارش' : 'سوال بعد →'}
      </button>
    </div>
  `;

  document.querySelectorAll('.opt').forEach(btn => {
    btn.addEventListener('click', () => selectOption(currentQ, +btn.dataset.v));
  });
  $('#prevBtn').addEventListener('click', goPrev);
  $('#nextBtn').addEventListener('click', goNext);

  document.onkeydown = e => {
    if(stage !== 'quiz') return;
    if(['1','2','3','4'].includes(e.key)){
      selectOption(currentQ, +e.key - 1);
    }
  };
}

function selectOption(qi, oi){
  clearAdvanceTimer();
  answers[qi] = oi;
  document.querySelectorAll('.opt').forEach((btn, i) => {
    btn.classList.toggle('selected', i === oi);
  });
  advanceTimer = setTimeout(() => {
    advanceTimer = null;
    if(qi === 27){
      if(answers.every(a => a !== null)){
        goToReport();
      }else{
        currentQ = answers.findIndex(a => a === null);
        renderQuiz();
        showToast('لطفاً به همه سوالات پاسخ دهید');
      }
    }else{
      currentQ = qi + 1;
      renderQuiz();
    }
  }, 380);
}

function goPrev(){
  clearAdvanceTimer();
  if(currentQ > 0){ currentQ--; renderQuiz(); }
}

function goNext(){
  clearAdvanceTimer();
  if(answers[currentQ] === null){
    showToast('لطفاً یک گزینه را انتخاب کنید');
    return;
  }
  if(currentQ < 27){
    currentQ++; renderQuiz();
  }else{
    if(answers.some(a => a === null)){
      currentQ = answers.findIndex(a => a === null);
      renderQuiz();
      showToast('برخی سوالات بی‌پاسخ مانده‌اند');
      return;
    }
    goToReport();
  }
}

function goToReport(){ stage = 'report'; renderReport(); }

/* =========================================================
   Compute Result
   ========================================================= */
function computeResult(){
  const scores = QUESTIONS.map((q, i) => q.r ? (3 - answers[i]) : answers[i]);

  const domains = DOMAINS.map(d => {
    let s = 0;
    for(let i = d.from; i <= d.to; i++) s += scores[i];
    let li = d.levels.findIndex(l => s >= l.min && s <= l.max);
    if(li < 0) li = d.levels.length - 1;
    return { meta: d, score: s, levelIdx: li, level: d.levels[li] };
  });

  const criticalAnswers = CRITICAL_INDEXES.some(i => answers[i] >= 2);
  if(criticalAnswers && domains[3].levelIdx < 3){
    domains[3].levelIdx = 3;
    domains[3].level = domains[3].meta.levels[3];
  }

  const total = scores.reduce((a, b) => a + b, 0);
  let tIdx = TOTAL_LEVELS.findIndex(l => total >= l.min && total <= l.max);
  if(tIdx < 0) tIdx = TOTAL_LEVELS.length - 1;

  return {
    scores, domains, total,
    totalLevel: TOTAL_LEVELS[tIdx],
    totalIdx: tIdx,
    critical: criticalAnswers || tIdx === 3,
    date: new Date().toLocaleDateString('fa-IR')
  };
}

      <summary>مشاهده پاسخ‌های شما به تفکیک</summary>
      <div class="rev-body">${reviewRows}</div>
    </details>

    <div class="card no-print" style="margin-top:22px">
      <h2 class="card-title">دریافت خروجی</h2>
      <p class="card-sub">گزارش را می‌توانید به‌صورت PDF ذخیره کنید یا آزمون را دوباره شروع کنید.</p>
      <div class="actions" style="margin-top:0">
        <button class="btn btn-primary" id="pdfBtn">💾 ذخیره گزارش (PDF)</button>
        <button class="btn btn-ghost" id="restartBtn">🔄 آزمون جدید</button>
      </div>
    </div>

    <div class="academy-credit">
      <span>تهیه‌شده در ${ACADEMY.name}</span>
    </div>

    <p class="disclaimer">
      این گزارش یک ابزار غربالگری و خودآگاهی است و جایگزین تشخیص یا درمان تخصصی نیست.
      در صورت نگرانی درباره سلامت روان خود یا فرزندتان، با روان‌شناس یا روان‌پزشک مشورت کنید.
    </p>
    <p class="disclaimer" style="margin-top:10px">
      برای دریافت راهنمایی بیشتر می‌توانید نتیجه را به آی‌دی <b>Eptima51</b> در ایتا یا تلگرام ارسال نمایید:
      <br>
      <a href="https://eitaa.com/Eptima51" target="_blank" rel="noopener" style="color:#0f6b4a">eitaa.com/Eptima51</a>
      &nbsp;·&nbsp;
      <a href="https://t.me/eptima51" target="_blank" rel="noopener" style="color:#0f6b4a">t.me/eptima51</a>
    </p>
  `;

  // انیمیشن پر شدن نمره کل
  setTimeout(() => {
    const el = $('#totalScore');
    if(el) animateNumber(el, r.total, 900);
  }, 200);

  // انیمیشن پر شدن لوله‌های داشبورد بصری
  setTimeout(() => {
    document.querySelectorAll('.vd-fill').forEach(el => {
      el.style.height = el.dataset.pct + '%';
    });
  }, 300);

  $('#pdfBtn').addEventListener('click', () => {
    document.querySelectorAll('details').forEach(d => d.open = true);
    setTimeout(() => window.print(), 100);
  });
  $('#restartBtn').addEventListener('click', () => {
    if(confirm('آزمون جدید شروع شود؟ پاسخ‌های فعلی پاک می‌شوند.')){
      answers = new Array(28).fill(null);
      info = { childName:'', parentName:'', relation:'', phone:'', birthDate:'' };
      currentQ = 0; stage = 'info';
      renderInfo();
    }
  });

  syncToPorsline(r);
}

/* =========================================================
   Optional: Sync to Porsline
   ========================================================= */
async function syncToPorsline(r){
  if(!PORSLINE.enabled) return;
  try{
    const data = {};
    answers.forEach((a, i) => {
      const pid = PORSLINE.questionIdMap[i];
      if(pid) data[pid] = a;
    });
    const res = await fetch(PORSLINE.proxyUrl, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ surveyId: PORSLINE.surveyId, answers: data, meta: info })
    });
    if(res.ok) console.log('Porsline sync OK');
  }catch(err){
    console.warn('Porsline sync failed', err);
  }
}

renderInfo();
</script>
